apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-review-operator
  namespace: default
  labels:
    app.kubernetes.io/name: pr-review-operator
    platform.atlassian.dev/tier: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pr-review-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pr-review-operator
        platform.atlassian.dev/tier: control-plane
    spec:
      serviceAccountName: pr-review-operator
      containers:
        - name: operator
          image: pr-review-operator:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: pr-agent-secrets
                optional: true
          env:
            - name: SANDBOX_BACKEND
              value: "kubernetes"
            - name: K8S_IN_CLUSTER
              value: "true"
            - name: K8S_SANDBOX_NAMESPACE
              value: "sandboxes"
            - name: K8S_SANDBOX_IMAGE
              value: "pr-sandbox-runner:latest"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
