apiVersion: v1
kind: ServiceAccount
metadata:
  name: pr-review-operator
  namespace: default
  labels:
    app.kubernetes.io/name: pr-review-operator
    platform.atlassian.dev/tier: control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pr-review-operator-role
rules:
  # Permissions for the PRReviewJob custom resource
  - apiGroups: ["platform.atlassian.dev"]
    resources: ["prreviewjobs", "prreviewjobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Permissions for managing ephemeral sandbox Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "delete", "deletecollection"]

  # Permissions for Core K8s resources (Pods, Pod Logs, ConfigMaps, Namespaces, Events)
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Permissions for Kopf framework leader election / peerings
  - apiGroups: ["kopf.dev"]
    resources: ["clusterkopfpeerings", "kopfpeerings"]
    verbs: ["*"]

  # Access to read CRD definitions
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pr-review-operator-binding
subjects:
  - kind: ServiceAccount
    name: pr-review-operator
    namespace: default
roleRef:
  kind: ClusterRole
  name: pr-review-operator-role
  apiGroup: rbac.authorization.k8s.io
