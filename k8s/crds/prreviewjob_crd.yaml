apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: prreviewjobs.platform.atlassian.dev
  labels:
    app.kubernetes.io/part-of: pr-review-agent
    platform.atlassian.dev/tier: control-plane
spec:
  group: platform.atlassian.dev
  names:
    kind: PRReviewJob
    plural: prreviewjobs
    singular: prreviewjob
    shortNames:
      - prj
      - prreview
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Repo
          type: string
          description: Target GitHub repository
          jsonPath: .spec.repo
        - name: PR
          type: integer
          description: Pull request number
          jsonPath: .spec.prNumber
        - name: Phase
          type: string
          description: Current lifecycle phase
          jsonPath: .status.phase
        - name: Bugs
          type: integer
          description: Sandbox-proven bugs
          jsonPath: .status.sandboxBugsCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - repo
                - prNumber
              properties:
                repo:
                  type: string
                  description: "Full repository name (e.g. 'octocat/Hello-World')"
                prNumber:
                  type: integer
                  description: "Pull request number to review"
                enableSandbox:
                  type: boolean
                  default: true
                  description: "Whether to run dynamic sandbox verification in K8s"
                cellId:
                  type: string
                  description: "Cell or regional partition identifier (e.g. 'cell-us-east-1a')"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                  description: "Reconciliation status of the PR review"
                staticIssuesCount:
                  type: integer
                  description: "Number of static issues identified by Agent 1"
                sandboxBugsCount:
                  type: integer
                  description: "Number of dynamic runtime bugs proven in K8s sandbox by Agent 2"
                summary:
                  type: string
                  description: "Aggregated review summary"
                message:
                  type: string
                  description: "Error message or diagnostic status"
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
      subresources:
        status: {}
